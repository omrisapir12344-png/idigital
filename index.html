<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="שירות הלקוחות הדיגיטלי של iDigital עם גאיה">
  <title>גאיה | שירות הלקוחות של iDigital</title>
  <style>
    :root { color-scheme: light; --ink:#08090b; --muted:#656b78; --violet:#6657d9; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      min-height:100svh; display:grid; place-items:center; overflow-x:hidden;
      font-family:Heebo,Arial,sans-serif; color:var(--ink);
      background:radial-gradient(circle at 75% 15%,rgba(115,91,224,.13),transparent 30%),#f6f7fa;
    }
    main { width:min(1120px,100%); min-height:100svh; padding:clamp(24px,5vw,72px); display:grid; grid-template-columns:1fr 1fr; align-items:center; gap:clamp(26px,6vw,84px); }
    .copy { max-width:570px; }
    .brand { display:block; width:184px; height:auto; margin:0 0 38px; mix-blend-mode:multiply; }
    h1 { margin:0; max-width:650px; font-size:clamp(2.4rem,5.7vw,5.7rem); line-height:.98; letter-spacing:-.065em; }
    p { margin:24px 0 0; max-width:530px; color:var(--muted); font-size:clamp(1.05rem,1.6vw,1.35rem); line-height:1.7; }
    .start { margin-top:34px; min-width:210px; min-height:58px; padding:0 28px; border:0; border-radius:16px; color:#fff; background:var(--ink); font:800 1.08rem Heebo,Arial,sans-serif; cursor:pointer; box-shadow:0 16px 34px rgba(8,9,11,.18); transition:transform .18s ease,box-shadow .18s ease; }
    .start:hover { transform:translateY(-2px); box-shadow:0 20px 38px rgba(8,9,11,.22); }
    .start:focus-visible { outline:3px solid var(--violet); outline-offset:4px; }
    .visual { position:relative; min-height:520px; display:grid; place-items:center; }
    .halo { position:absolute; width:min(43vw,470px); aspect-ratio:1; border-radius:50%; background:linear-gradient(145deg,#ece9ff,#fff 62%); box-shadow:0 28px 90px rgba(55,42,117,.13); }
    .gaia { position:relative; z-index:1; width:min(38vw,410px); height:auto; filter:drop-shadow(0 30px 26px rgba(30,25,61,.16)); }
    .status { position:absolute; z-index:2; bottom:8%; right:7%; padding:12px 17px; border:1px solid rgba(8,9,11,.08); border-radius:999px; background:rgba(255,255,255,.88); backdrop-filter:blur(10px); font-size:.9rem; font-weight:700; box-shadow:0 12px 30px rgba(8,9,11,.09); }
    .status::before { content:""; display:inline-block; width:9px; height:9px; margin-left:8px; border-radius:50%; background:#27aa5f; }
    @media (max-width:760px) {
      body { place-items:start center; }
      main { min-height:100svh; grid-template-columns:1fr; grid-template-rows:auto 1fr; padding:28px 22px 132px; text-align:center; gap:18px; }
      .copy { margin:auto; }
      .brand { width:164px; margin:0 auto 25px; }
      h1 { font-size:clamp(2.55rem,13vw,4.3rem); }
      p { margin-top:18px; font-size:1.03rem; }
      .start { width:100%; max-width:340px; margin-top:25px; }
      .visual { min-height:310px; order:-1; }
      .halo { width:min(78vw,330px); }
      .gaia { width:min(69vw,300px); }
      .status { right:calc(50% - 145px); bottom:0; }
    }
  </style>
</head>

    (function () {
  'use strict';

  if (window.__IDIGITAL_GAIA_FRESHCHAT_GATE__) return;
  window.__IDIGITAL_GAIA_FRESHCHAT_GATE__ = true;

  var FRESHCHAT_SRC = 'https://fw-cdn.com/17200003/7509210.js';
  var PROFILE_KEY = 'idigital_gaia_chat_profile';
  var launcher = document.getElementById('idg-gaia-launcher');
  var overlay = document.getElementById('idg-gaia-overlay');
  var closeButton = document.getElementById('idg-gaia-close');
  var form = document.getElementById('idg-gaia-form');
  var nameInput = document.getElementById('idg-gaia-full-name');
  var phoneInput = document.getElementById('idg-gaia-phone');
  var nameField = document.getElementById('idg-gaia-name-field');
  var phoneField = document.getElementById('idg-gaia-phone-field');
  var submitButton = document.getElementById('idg-gaia-submit');
  var errorBox = document.getElementById('idg-gaia-error');
  var widgetLoading = false;

  function readProfile() {
    try { return JSON.parse(sessionStorage.getItem(PROFILE_KEY) || 'null'); }
    catch (error) { return null; }
  }

  function saveProfile(profile) {
    try { sessionStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
    catch (error) {}
  }

  function splitName(fullName) {
    var parts = fullName.trim().replace(/\s+/g, ' ').split(' ');
    return { firstName: parts.shift() || '', lastName: parts.join(' ') };
  }

  function normalizeIsraeliPhone(value) {
    var digits = String(value || '').replace(/\D/g, '');
    if (digits.indexOf('972') === 0) digits = digits.slice(3);
    if (digits.charAt(0) === '0') digits = digits.slice(1);
    return /^[1-9]\d{7,8}$/.test(digits) ? digits : '';
  }

  function openForm() {
    overlay.classList.add('idg-open');
    document.body.style.overflow = 'hidden';
    window.setTimeout(function () { nameInput.focus(); }, 50);
  }

  function closeForm() {
    overlay.classList.remove('idg-open');
    document.body.style.overflow = '';
  }

  function setLoading(isLoading) {
    widgetLoading = isLoading;
    submitButton.disabled = isLoading;
    submitButton.textContent = isLoading ? 'פותחים את הצ׳אט…' : 'המשך לצ׳אט';
  }

  function registerWidgetEvents() {
    if (!window.fcWidget || typeof window.fcWidget.on !== 'function') return;
    window.fcWidget.on('widget:opened', function () { launcher.hidden = true; });
    window.fcWidget.on('widget:closed', function () { launcher.hidden = false; });
  }

  function waitForWidget(profile, attempts) {
    if (window.fcWidget && typeof window.fcWidget.open === 'function') {
      registerWidgetEvents();

      if (window.fcWidget.user && typeof window.fcWidget.user.setProperties === 'function') {
        window.fcWidget.user.setProperties({
          firstName: profile.firstName,
          lastName: profile.lastName,
          phone: profile.phone,
          phoneCountryCode: '+972'
        });
      }

      setLoading(false);
      window.fcWidget.open();
      return;
    }

    if (attempts <= 0) {
      setLoading(false);
      launcher.hidden = false;
      errorBox.classList.add('idg-show');
      openForm();
      return;
    }

    window.setTimeout(function () { waitForWidget(profile, attempts - 1); }, 100);
  }

  function loadFreshchat(profile) {
    closeForm();
    launcher.hidden = true;

    if (window.fcWidget && typeof window.fcWidget.open === 'function') {
      waitForWidget(profile, 1);
      return;
    }
    if (widgetLoading) return;

    setLoading(true);
    window.fcWidgetMessengerConfig = {
      firstName: profile.firstName,
      lastName: profile.lastName,
      phone: profile.phone,
      phoneCountryCode: '+972',
      config: {
        headerProperty: {
          hideChatButton: true,
          direction: 'rtl'
        }
      }
    };

    if (!document.getElementById('idg-gaia-freshchat-script')) {
      var script = document.createElement('script');
      script.id = 'idg-gaia-freshchat-script';
      script.src = FRESHCHAT_SRC;
      script.setAttribute('chat', 'true');
      script.async = true;
      script.onerror = function () {
        setLoading(false);
        launcher.hidden = false;
        errorBox.classList.add('idg-show');
        openForm();
      };
      document.body.appendChild(script);
    }

    waitForWidget(profile, 150);
  }

  launcher.addEventListener('click', function () {
    var profile = readProfile();
    if (profile && profile.firstName && profile.phone) {
      loadFreshchat(profile);
    } else {
      errorBox.classList.remove('idg-show');
      openForm();
    }
  });

  closeButton.addEventListener('click', closeForm);
  overlay.addEventListener('click', function (event) {
    if (event.target === overlay && !widgetLoading) closeForm();
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && overlay.classList.contains('idg-open') && !widgetLoading) closeForm();
  });
  nameInput.addEventListener('input', function () { nameField.classList.remove('idg-invalid'); });
  phoneInput.addEventListener('input', function () { phoneField.classList.remove('idg-invalid'); });

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    var fullName = nameInput.value.trim().replace(/\s+/g, ' ');
    var phone = normalizeIsraeliPhone(phoneInput.value);
    var validName = fullName.length >= 2;

    nameField.classList.toggle('idg-invalid', !validName);
    phoneField.classList.toggle('idg-invalid', !phone);
    errorBox.classList.remove('idg-show');
    if (!validName || !phone) return;

    var name = splitName(fullName);
    var profile = {
      firstName: name.firstName,
      lastName: name.lastName,
      phone: phone
    };

    saveProfile(profile);
    loadFreshchat(profile);
  });
})();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeGaiaWidget, { once: true });
  } else {
    initializeGaiaWidget();
  }
})();

</script>
  <script>
    document.addEventListener('click', function (event) {
      if (!event.target.closest('[data-open-gaia]')) return;
      var launcher = document.getElementById('idg-gaia-launcher');
      if (launcher) launcher.click();
    });
  </script>
